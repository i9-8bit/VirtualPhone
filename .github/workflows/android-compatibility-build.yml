name: Android compatibility build

on:
  pull_request:
  push:
    branches:
      - main
      - compat/android-4-to-17-baseline

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 17 SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          SDKMANAGER="$(find "${SDK_ROOT}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "platforms;android-37" "build-tools;37.0.0"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug
