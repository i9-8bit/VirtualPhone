name: Build and publish official signed Android 1–17 APKs

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  official-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require a tag from the main branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Refusing official publication: this tag is not on origin/main."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 17 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          SDKMANAGER="$(find "${SDK_ROOT}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;37.0.0"

      - name: Validate and load the official signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing GitHub Actions secret: $name"
              echo "Add the official release keystore secrets before tagging a release."
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/virtualphone-official-release.jks"
          test -s "$RUNNER_TEMP/virtualphone-official-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/virtualphone-official-release.jks" >> "$GITHUB_ENV"

      - name: Build every signed release APK
        working-directory: android
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/virtualphone-official-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace \
            assembleAndroid1Release \
            assembleAndroid2Release \
            assembleAndroid3Release \
            assembleAndroid4Release \
            assembleAndroid5Release \
            assembleAndroid6Release \
            assembleAndroid7Release \
            assembleAndroid8Release \
            assembleAndroid9Release \
            assembleAndroid10Release \
            assembleAndroid11Release \
            assembleAndroid12Release \
            assembleAndroid13Release \
            assembleAndroid14Release \
            assembleAndroid15Release \
            assembleAndroid16Release \
            assembleAndroid17Release

      - name: Assemble official release package and checksums
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          DIST="dist/release"
          mkdir -p "$DIST/APKs" "$DIST/package/APKs" "$DIST/package/Source"

          copy_apk() {
            local flavor="$1"
            local android_version="$2"
            local api_range="$3"
            local source="android/app/build/outputs/apk/${flavor}/release/app-${flavor}-release.apk"
            local filename="VirtualPhone-${TAG}-Android-${android_version}-API-${api_range}.apk"
            test -f "$source"
            cp "$source" "$DIST/APKs/$filename"
            cp "$source" "$DIST/package/APKs/$filename"
          }

          copy_apk android1  1  "1-to-3"
          copy_apk android2  2  "4-to-10"
          copy_apk android3  3  "11-to-13"
          copy_apk android4  4  "14-to-20"
          copy_apk android5  5  "21-to-22"
          copy_apk android6  6  "23"
          copy_apk android7  7  "24-to-25"
          copy_apk android8  8  "26-to-27"
          copy_apk android9  9  "28"
          copy_apk android10 10 "29"
          copy_apk android11 11 "30"
          copy_apk android12 12 "31-to-32"
          copy_apk android13 13 "33"
          copy_apk android14 14 "34"
          copy_apk android15 15 "35"
          copy_apk android16 16 "36"
          copy_apk android17 17 "37"

          git archive --format=zip --output "$DIST/package/Source/VirtualPhone-$TAG-Full-Source.zip" "$GITHUB_SHA"

          cat > "$DIST/package/README.txt" <<EOF
          VirtualPhone $TAG — Official Android 1–17 APK package
          =====================================================

          This package contains 17 standalone APKs, each signed with the
          official project release keystore. Match the APK to the Android
          major version and API range in its filename.

          The server URL prefilled in every APK is:
          https://clan-rounds-bug-genealogy.trycloudflare.com

          Cloudflare Quick Tunnel URLs are temporary and may change. Edit the
          server URL in VirtualPhone Settings if it stops working.

          Android 1–3 networking is experimental. A successful build is not
          physical-device validation. Legacy TLS proxy software can introduce
          security risks; do not use any proxy that disables remote certificate
          verification. The included full source corresponds to tag $TAG.
          EOF

          (cd "$DIST/package" && zip -qr "../VirtualPhone-$TAG-Official-Android-1-to-17.zip" .)
          cp "$DIST/package/Source/VirtualPhone-$TAG-Full-Source.zip" "$DIST/"
          sha256sum "$DIST"/APKs/*.apk "$DIST/VirtualPhone-$TAG-Official-Android-1-to-17.zip" "$DIST/VirtualPhone-$TAG-Full-Source.zip" > "$DIST/SHA256SUMS.txt"

      - name: Publish official release and individual APK downloads
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          gh release create "$TAG" \
            dist/release/APKs/*.apk \
            "dist/release/VirtualPhone-$TAG-Official-Android-1-to-17.zip" \
            "dist/release/VirtualPhone-$TAG-Full-Source.zip" \
            dist/release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "VirtualPhone $TAG — Official Android 1–17" \
            --notes "Official signed release containing 17 version-specific standalone APKs and a full ZIP/source archive. Android 1–3 networking remains experimental and needs real-device verification. Verify checksums from SHA256SUMS.txt. Quick Tunnel URLs can expire or change." \
            --verify-tag
