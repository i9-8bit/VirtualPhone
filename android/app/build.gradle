plugins {
    id 'com.android.application'
}

android {
    namespace 'com.virtualphone.i9'
    compileSdk 37

    defaultConfig {
        applicationId 'com.virtualphone.i9'
        // Android 4.0 (API 14); actual TLS capability depends on system provider.
        minSdk 14
        targetSdk 37
        versionCode 3
        versionName 'v1.0 Alpha'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds = false
        abortOnError = false
    }
}

dependencies {
    // Preserves the version tested by the developer on Android 4.3.
    implementation 'org.java-websocket:Java-WebSocket:1.3.9'
}
