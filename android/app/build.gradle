dependencies {
    // Kept for compatibility with the developer's Android 4.3 test phone.
    implementation 'org.java-websocket:Java-WebSocket:1.3.9'
}

// Configure release signing only when a real keystore is provided by the
// release workflow. Never commit the keystore or its passwords to source control.
def officialKeystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
def hasOfficialSigning = officialKeystorePath != null
        && !officialKeystorePath.trim().isEmpty()
        && System.getenv("ANDROID_KEYSTORE_PASSWORD") != null
        && System.getenv("ANDROID_KEY_ALIAS") != null
        && System.getenv("ANDROID_KEY_PASSWORD") != null

if (hasOfficialSigning) {
    android.signingConfigs.create("officialRelease") {
        storeFile = file(officialKeystorePath)
        storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
        keyAlias = System.getenv("ANDROID_KEY_ALIAS")
        keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
    }
    android.buildTypes.getByName("release").signingConfig =
            android.signingConfigs.getByName("officialRelease")
}
