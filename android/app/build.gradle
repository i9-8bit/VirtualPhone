    defaultConfig {
        applicationId 'com.virtualphone.i9'
        minSdk 14
        targetSdk 37
        versionCode 3
        versionName 'v1.0 Alpha'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds = false
        abortOnError = false
    }
}

dependencies {
    // Kept for compatibility with the developer's Android 4.3 test phone.
    implementation 'org.java-websocket:Java-WebSocket:1.3.9'
}
