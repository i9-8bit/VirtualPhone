plugins {
    id 'com.android.application'
}

android {
    namespace 'com.virtualphone.i9'
    compileSdk 37

    flavorDimensions += "androidCompatibility"

    /*
     * Each flavor is one complete, installable VirtualPhone app for the
     * corresponding Android major-version family. The suffix keeps each
     * compatibility APK separate from the official Alpha app and from the
     * other version-specific APKs.
     */
    productFlavors {
        android4 {
            dimension "androidCompatibility"
            applicationIdSuffix ".android4"
            versionCode 104
            versionName "v1.0 Alpha - Android 4"
            minSdk 14
            targetSdk 20
            maxSdk = 20
            manifestPlaceholders = [appLabel: "VirtualPhone Android 4"]
        }
        android5 {
            dimension "androidCompatibility"
            applicationIdSuffix ".android5"
            versionCode 105
            versionName "v1.0 Alpha - Android 5"
            minSdk 21
            targetSdk 22
            maxSdk = 22
            manifestPlaceholders = [appLabel: "VirtualPhone Android 5"]
        }
        android6 {
            dimension "androidCompatibility"
            applicationIdSuffix ".android6"
            versionCode 106
            versionName "v1.0 Alpha - Android 6"
            minSdk 23
            targetSdk 23
