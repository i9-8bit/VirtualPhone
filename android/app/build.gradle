plugins {
    id 'com.android.application'
}

android {
    namespace 'com.virtualphone.i9'
    compileSdk 37

    flavorDimensions += "androidCompatibility"

    /*
     * Each flavor is one complete, installable VirtualPhone app for the
     * corresponding Android major-version family. The suffix keeps each
     * compatibility APK separate from the official Alpha app and from the
     * other version-specific APKs.
     */
    productFlavors {
        android1 {
            dimension "androidCompatibility"
            applicationIdSuffix ".android1"
            versionCode 301
            versionName "v1.2.0 - Android 1"
            minSdk 1
            targetSdk 3
            maxSdk = 3
            manifestPlaceholders = [appLabel: "VirtualPhone 1.2 - Android 1"]
        }
        android2 {
